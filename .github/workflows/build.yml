name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install SDKs
        run: |
          mkdir -p "$THEOS/sdks"
          curl -L --fail -o /tmp/sdks.tgz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar xzf /tmp/sdks.tgz -C /tmp
          cp -R /tmp/sdks-master/* "$THEOS/sdks/"
          ls "$THEOS/sdks" | head -5

      - name: Build (arm64e only)
        run: |
          make clean || true
          make 2>&1 | tail -80

      - name: Locate dylib
        run: |
          echo "=== all dylib found ==="
          find . -name "*.dylib" -type f -not -path "*dSYM*" -exec ls -l {} \;
          echo "=== .theos/obj tree ==="
          find .theos -type f 2>/dev/null | head -30
          mkdir -p out
          A64E=".theos/obj/arm64e/igtap2.dylib"
          if [ -f "$A64E" ]; then
            cp "$A64E" out/igtap2.dylib
            echo "used arm64e build"
          else
            echo "!! arm64e build missing, trying any:"
            find . -name "igtap2.dylib" -not -path "*dSYM*" -exec cp {} out/ \;
          fi
          echo "=== result ==="
          ls -l out/
          lipo -info out/igtap2.dylib || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: igtap2-dylib
          path: out/
          if-no-files-found: error
